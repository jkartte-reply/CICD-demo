name: CI/CD - Build & Push to GHCR

on:
  push:
    # Tests laufen bei Pushes zu main und develop
    # Deploy-Pipeline startet bei Pushes zu release/* Branches
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]
  # Manueller Trigger über GitHub UI (Actions → Run workflow)
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────
  # JOB 1: Tests
  # Läuft IMMER — bei Pushes, PRs und manuellem Trigger.
  # Gatekeeper: schlägt dieser Job fehl, laufen Job 2 und 3 nicht.
  # ─────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check . || true

      - name: Run tests
        run: pytest --cov=. --cov-report=term

  # ─────────────────────────────────────────────────────
  # JOB 2: Image bauen und zu Test pushen
  # Läuft NUR wenn ein release/* Branch gepusht wird
  # (z.B. release/1.2) oder manuell getriggert wird.
  #
  # Der Branch-Name wird als Image-Tag verwendet:
  # release/1.2 → release-1.2 (Slash ist in Docker-Tags nicht erlaubt)
  #
  # Image wird mit drei Tags gepusht:
  #   :test           → "aktueller Test-Stand"
  #   :sha-<hash>     → unveränderlicher Versions-Anker
  #   :release-1.2    → welche Release-Version das ist
  # ─────────────────────────────────────────────────────
  push-to-test:
    name: Build & Push to Test
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/heads/release/') || github.event_name == 'workflow_dispatch'
    environment: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set release tag
        # Ersetzt / durch - im Branch-Namen: release/1.2 → release-1.2
        run: echo "RELEASE_TAG=$(echo ${GITHUB_REF_NAME} | tr '/' '-')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (test)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────
  # JOB 3: Image zu Production promoten
  # Braucht Job 2 als Voraussetzung.
  # "environment: production" pausiert den Job und zeigt
  # den Approval-Button — erst nach Klick läuft er weiter.
  # Promotet :sha-<hash> als :prod und :latest —
  # Single Artifact Promotion: was in Test war, landet in Prod.
  # ─────────────────────────────────────────────────────
  push-to-production:
    name: Promote to Production
    runs-on: ubuntu-latest
    needs: push-to-test
    environment: production

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote image to production
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod
          docker tag  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
